<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - 孩子端</title>
  <link href="https://cdn.jsdelivr.net/npm/smiley-sans@1.1.1/dist/SmileySans-Oblique.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-primary: #FF6B35;
      --color-primary-light: #FF8A50;
      --color-secondary: #4ECDC4;
      --color-accent: #FFD93D;
      --color-success: #4ECDC4;
      --color-error: #FF6B6B;
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --text-muted: #9CA3AF;
      --bg-card: #FFFFFF;
      --radius-card: 16px;
      --radius-button: 12px;
      --shadow-card: 0 4px 12px rgba(255, 107, 53, 0.15);
      --nav-height: 56px;
    }

    body {
      font-family: 'Smiley Sans Oblique', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #FFF8F0 0%, #FFEDD8 50%, #FFFBE8 100%);
      padding-bottom: var(--nav-height);
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23FFD93D' fill-opacity='0.05'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .page-content {
      padding: 16px;
      position: relative;
      z-index: 1;
    }

    /* 用户信息区 */
    .user-info {
      background: linear-gradient(135deg, #FF6B35 0%, #FF8A50 100%);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      margin-bottom: 24px;
      color: white;
      box-shadow:
        0 8px 24px rgba(255, 107, 53, 0.25),
        0 4px 8px rgba(255, 107, 53, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
    }

    .user-info::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.1) 0%, transparent 50%);
      animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .user-avatar {
      width: 72px;
      height: 72px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    .user-avatar svg {
      width: 36px;
      height: 36px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    .welcome-text {
      font-size: 26px;
      font-weight: 700;
      position: relative;
    }

    /* Tab切换 */
    .tab-container {
      background: white;
      border-radius: var(--radius-card);
      margin-bottom: 16px;
      box-shadow:
        var(--shadow-card),
        0 1px 2px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      border: 1px solid rgba(255, 107, 53, 0.08);
    }

    .tab-header {
      display: flex;
      border-bottom: 1px solid #E5E7EB;
    }

    .tab-btn {
      flex: 1;
      padding: 18px;
      text-align: center;
      font-size: 16px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease-out;
      border-bottom: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn svg {
      width: 18px;
      height: 18px;
      stroke: var(--text-secondary);
      stroke-width: 2;
      fill: none;
      transition: stroke 0.15s;
    }

    .tab-btn.active {
      color: var(--color-primary);
      font-weight: 600;
      border-bottom-color: var(--color-primary);
      background: linear-gradient(180deg, transparent 0%, rgba(255, 107, 53, 0.05) 100%);
    }

    .tab-btn.active svg {
      stroke: var(--color-primary);
    }

    .tab-content {
      padding: 18px;
    }

    /* 历史记录周分组 */
    .week-group {
      margin-bottom: 12px;
    }

    .week-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      background: #F9FAFB;
      border-radius: 14px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: all 0.15s;
    }

    .week-header.expanded {
      background: linear-gradient(135deg, #FFF8F0 0%, #FFEDD8 100%);
    }

    .week-title {
      font-size: 14px;
      color: var(--text-primary);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .week-title svg {
      width: 16px;
      height: 16px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    .week-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease-out;
    }

    .week-icon svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-muted);
      stroke-width: 2;
      fill: none;
    }

    .week-header.expanded .week-icon {
      transform: rotate(180deg);
    }

    .week-content {
      padding: 0 14px;
    }

    .record-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #E5E7EB;
    }

    .record-item:last-child {
      border-bottom: none;
    }

    .record-name {
      font-size: 14px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .record-name svg {
      width: 16px;
      height: 16px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    .record-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .record-date {
      font-size: 12px;
      color: var(--text-muted);
    }

    .record-points {
      font-size: 14px;
      color: var(--color-primary);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .record-points svg {
      width: 12px;
      height: 12px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    .record-points.negative {
      color: var(--color-secondary);
    }

    .record-points.negative svg {
      stroke: var(--color-secondary);
    }

    /* 周统计 */
    .week-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      background: linear-gradient(135deg, #FFF8F0 0%, #FFEDD8 100%);
      border-radius: 14px;
      margin-top: 10px;
      border: 1px solid rgba(255, 107, 53, 0.1);
    }

    .summary-text {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .summary-text svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-secondary);
      stroke-width: 2;
      fill: none;
    }

    .summary-value {
      font-size: 14px;
      color: var(--color-primary);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .summary-value svg {
      width: 14px;
      height: 14px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    /* 退出登录 */
    .logout-section {
      margin-top: 24px;
    }

    .logout-btn {
      width: 100%;
      background: white;
      border: 2px solid #E5E7EB;
      border-radius: 16px;
      padding: 18px;
      font-size: 16px;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease-out;
      box-shadow:
        var(--shadow-card),
        0 1px 2px rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logout-btn svg {
      width: 20px;
      height: 20px;
      stroke: var(--text-secondary);
      stroke-width: 2;
      fill: none;
      transition: stroke 0.15s;
    }

    .logout-btn:hover {
      border-color: var(--color-error);
      color: var(--color-error);
    }

    .logout-btn:hover svg {
      stroke: var(--color-error);
    }

    /* 底部导航 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow:
        0 -4px 16px rgba(0, 0, 0, 0.08),
        0 -1px 2px rgba(0, 0, 0, 0.04);
      border-top: 1px solid #E5E7EB;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      cursor: pointer;
      transition: all 0.15s ease-out;
      position: relative;
    }

    .nav-item::before {
      content: '';
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 3px;
      background: var(--color-primary);
      border-radius: 3px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .nav-item.active::before {
      opacity: 1;
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    .nav-icon svg {
      width: 24px;
      height: 24px;
      stroke: var(--text-muted);
      stroke-width: 1.5;
      fill: none;
      transition: stroke 0.15s ease-out;
    }

    .nav-item.active .nav-icon svg {
      stroke: var(--color-primary);
    }

    .nav-item:hover .nav-icon {
      transform: translateY(-2px);
    }

    .nav-label {
      font-size: 12px;
      color: var(--text-muted);
      transition: color 0.15s ease-out;
    }

    .nav-item.active .nav-label {
      color: var(--color-primary);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="page-content">
    <!-- 用户信息区 -->
    <div class="user-info">
      <div class="user-avatar">
        <!-- Smile icon -->
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
      </div>
      <div class="welcome-text">欢迎，小明！</div>
    </div>

    <!-- Tab切换 -->
    <div class="tab-container">
      <div class="tab-header">
        <div class="tab-btn active" onclick="switchTab('tasks')">
          <!-- ListTodo icon -->
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="6" height="6" rx="1"/><path d="M11 4h10"/><path d="M11 8h10"/><path d="M11 12h10"/><path d="M3 16l3.5 3.5L10 14"/></svg>
          任务历史
        </div>
        <div class="tab-btn" onclick="switchTab('gifts')">
          <!-- Gift icon -->
          <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>
          礼物历史
        </div>
      </div>
      <div class="tab-content">
        <!-- 任务历史Tab内容 -->
        <div id="tasksTab">
          <!-- 本周（展开） -->
          <div class="week-group">
            <div class="week-header expanded">
              <div class="week-title">
                <!-- Calendar icon -->
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                本周（5月19日-5月25日）
              </div>
              <div class="week-icon">
                <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
            </div>
            <div class="week-content">
              <div class="record-item">
                <div class="record-name">
                  <!-- BookOpen icon -->
                  <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3 3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3 3h7z"/></svg>
                  阅读书籍
                </div>
                <div class="record-meta">
                  <div class="record-date">5月21日</div>
                  <div class="record-points">
                    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    +10
                  </div>
                </div>
              </div>
              <div class="record-item">
                <div class="record-name">
                  <!-- Sparkles icon -->
                  <svg viewBox="0 0 24 24"><path d="M12 3l1.912 5.813 6.088-1.913-3.5 3.5 3.5 3.5-6.088-1.913L12 21l-1.912-5.813L4 17l3.5-3.5L4 10l6.088 1.913L12 3z"/></svg>
                  整理房间
                </div>
                <div class="record-meta">
                  <div class="record-date">5月20日</div>
                  <div class="record-points">
                    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    +5
                  </div>
                </div>
              </div>
              <div class="week-summary">
                <div class="summary-text">
                  <!-- CheckCircle icon -->
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>
                  本周共完成 2 个任务
                </div>
                <div class="summary-value">
                  <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                  获 15 积分
                </div>
              </div>
            </div>
          </div>

          <!-- 上周（折叠） -->
          <div class="week-group">
            <div class="week-header">
              <div class="week-title">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                上周（5月12日-5月18日）
              </div>
              <div class="week-icon">
                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
              </div>
            </div>
          </div>

          <!-- 两周前（折叠） -->
          <div class="week-group">
            <div class="week-header">
              <div class="week-title">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                两周前（5月5日-5月11日）
              </div>
              <div class="week-icon">
                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
              </div>
            </div>
          </div>
        </div>

        <!-- 礼物历史Tab内容 -->
        <div id="giftsTab" style="display: none;">
          <div class="week-group">
            <div class="week-header expanded">
              <div class="week-title">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                本周（5月19日-5月25日）
              </div>
              <div class="week-icon">
                <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
            </div>
            <div class="week-content">
              <div class="record-item">
                <div class="record-name">
                  <!-- BookOpen icon -->
                  <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3 3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3 3h7z"/></svg>
                  绘本
                </div>
                <div class="record-meta">
                  <div class="record-date">5月21日</div>
                  <div class="record-points negative">
                    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    -30
                  </div>
                </div>
              </div>
              <div class="week-summary">
                <div class="summary-text">
                  <!-- Gift icon -->
                  <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>
                  本周共兑换 1 个礼物
                </div>
                <div class="summary-value" style="color: var(--color-secondary);">
                  <svg viewBox="0 0 24 24" style="stroke: var(--color-secondary);"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                  消耗 30 积分
                </div>
              </div>
            </div>
          </div>

          <div class="week-group">
            <div class="week-header">
              <div class="week-title">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                上周（5月12日-5月18日）
              </div>
              <div class="week-icon">
                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 退出登录 -->
    <div class="logout-section">
      <button class="logout-btn">
        <!-- LogOut icon -->
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        退出登录
      </button>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="bottom-nav">
    <div class="nav-item">
      <div class="nav-icon">
        <!-- ListTodo icon -->
        <svg viewBox="0 0 24 24">
          <rect x="3" y="5" width="6" height="6" rx="1"/>
          <path d="M11 4h10"/>
          <path d="M11 8h10"/>
          <path d="M11 12h10"/>
          <path d="M3 16l3.5 3.5L10 14"/>
        </svg>
      </div>
      <div class="nav-label">任务</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">
        <!-- Gift icon -->
        <svg viewBox="0 0 24 24">
          <rect x="3" y="8" width="18" height="4" rx="1"/>
          <path d="M12 8v13"/>
          <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>
          <path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>
        </svg>
      </div>
      <div class="nav-label">礼物</div>
    </div>
    <div class="nav-item active">
      <div class="nav-icon">
        <!-- User icon -->
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4"/>
          <path d="M20 21a8 8 0 1 0-16 0"/>
        </svg>
      </div>
      <div class="nav-label">我的</div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      const taskBtn = document.querySelector('.tab-btn:nth-child(1)');
      const giftBtn = document.querySelector('.tab-btn:nth-child(2)');
      const tasksTab = document.getElementById('tasksTab');
      const giftsTab = document.getElementById('giftsTab');

      if (tab === 'tasks') {
        taskBtn.classList.add('active');
        giftBtn.classList.remove('active');
        tasksTab.style.display = 'block';
        giftsTab.style.display = 'none';
      } else {
        taskBtn.classList.remove('active');
        giftBtn.classList.add('active');
        tasksTab.style.display = 'none';
        giftsTab.style.display = 'block';
      }
    }
  </script>
</body>
</html>
