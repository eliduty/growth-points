<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>孩子端登录 - 家庭积分兑换系统</title>
  <link href="https://cdn.jsdelivr.net/npm/smiley-sans@1.1.1/dist/SmileySans-Oblique.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-primary: #FF6B35;
      --color-primary-light: #FF8A50;
      --color-secondary: #4ECDC4;
      --color-accent: #FFD93D;
      --color-success: #4ECDC4;
      --color-error: #FF6B6B;
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --text-muted: #9CA3AF;
    }

    body {
      font-family: 'Smiley Sans Oblique', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #FFF8F0 0%, #FFEDD8 50%, #FFFBE8 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      position: relative;
    }

    /* 背景装饰 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23FFD93D' fill-opacity='0.08'%3E%3Cpolygon points='50 0 55 20 75 20 60 32 65 50 50 40 35 50 40 32 25 20 45 20'/%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .login-container {
      width: 100%;
      max-width: 375px;
      background: white;
      border-radius: 28px;
      box-shadow:
        0 8px 32px rgba(255, 107, 53, 0.15),
        0 2px 8px rgba(255, 107, 53, 0.1);
      padding: 40px 28px;
      position: relative;
      overflow: hidden;
      z-index: 1;
      animation: fadeInScale 0.5s ease-out;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* 装饰星星 */
    .star {
      position: absolute;
      color: #FFD93D;
      animation: twinkle 2s ease-in-out infinite;
    }

    .star svg {
      width: 20px;
      height: 20px;
      stroke: #FFD93D;
      stroke-width: 2;
      fill: #FFD93D;
    }

    .star-1 { top: 16px; left: 20px; animation-delay: 0s; }
    .star-2 { top: 16px; right: 20px; animation-delay: 0.5s; }
    .star-3 { bottom: 80px; left: 12px; animation-delay: 1s; }
    .star-4 { bottom: 80px; right: 12px; animation-delay: 1.5s; }

    @keyframes twinkle {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.8; }
      50% { transform: scale(1.2) rotate(15deg); opacity: 1; }
    }

    /* 顶部装饰 */
    .header-decoration {
      text-align: center;
      margin-bottom: 28px;
      padding-top: 20px;
    }

    .logo-icons {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 20px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bounce 3s ease-in-out infinite;
    }

    .logo-icon svg {
      width: 32px;
      height: 32px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    .logo-icon.gift {
      background: linear-gradient(135deg, #FF6B35 0%, #FF8A50 100%);
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
      animation-delay: 0s;
    }

    .logo-icon.trophy {
      background: linear-gradient(135deg, #FFD93D 0%, #FFE066 100%);
      box-shadow: 0 4px 12px rgba(255, 217, 61, 0.3);
      animation-delay: 1s;
    }

    .logo-icon.trophy svg {
      stroke: white;
      fill: none;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      color: #FF6B35;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 14px;
      color: #6B7280;
    }

    /* 登录表单 */
    .login-form {
      margin-top: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      color: #1F2937;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-input {
      width: 100%;
      height: 50px;
      border: 2px solid #E5E7EB;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 16px;
      font-family: inherit;
      transition: all 0.2s ease-out;
      background: #F9FAFB;
    }

    .form-input:focus {
      outline: none;
      border-color: #FF6B35;
      background: white;
      box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1), 0 2px 8px rgba(255, 107, 53, 0.1);
    }

    .form-input::placeholder {
      color: #9CA3AF;
    }

    /* 登录按钮 */
    .login-btn {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, #FF6B35 0%, #FF8A50 100%);
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 18px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease-out;
      box-shadow: 0 4px 16px rgba(255, 107, 53, 0.25);
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 53, 0.35);
    }

    .login-btn:hover::before {
      left: 100%;
    }

    .login-btn:active {
      transform: translateY(0) scale(0.98);
      box-shadow: 0 2px 8px rgba(255, 107, 53, 0.2);
    }

    /* 激励标语 */
    .motivation {
      margin-top: 28px;
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #FFF8F0 0%, #FFEDD8 100%);
      border-radius: 16px;
      border: 1px solid rgba(255, 107, 53, 0.1);
    }

    .motivation-text {
      font-size: 14px;
      color: #FF6B35;
      line-height: 1.6;
    }

    /* 底部装饰波浪 */
    .wave-decoration {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 10px;
      background: linear-gradient(90deg, #FF6B35, #4ECDC4, #FFD93D, #FF6B35);
      border-radius: 0 0 28px 28px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- 装饰星星 -->
    <div class="star star-1">
      <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    </div>
    <div class="star star-2">
      <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    </div>
    <div class="star star-3">
      <svg viewBox="0 0 24 24" style="width: 16px; height: 16px;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    </div>
    <div class="star star-4">
      <svg viewBox="0 0 24 24" style="width: 16px; height: 16px;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    </div>

    <!-- 顶部装饰 -->
    <div class="header-decoration">
      <div class="logo-icons">
        <div class="logo-icon gift">
          <!-- Gift icon -->
          <svg viewBox="0 0 24 24">
            <rect x="3" y="8" width="18" height="4" rx="1"/>
            <path d="M12 8v13"/>
            <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>
            <path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>
          </svg>
        </div>
        <div class="logo-icon trophy">
          <!-- Trophy icon -->
          <svg viewBox="0 0 24 24">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
            <path d="M4 22h16"/>
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
          </svg>
        </div>
      </div>
      <h1 class="title">家庭积分兑换系统</h1>
      <p class="subtitle">孩子端登录</p>
    </div>

    <!-- 登录表单 -->
    <form class="login-form">
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input type="text" class="form-input" placeholder="请输入用户名">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" class="form-input" placeholder="请输入密码">
      </div>
      <button type="button" class="login-btn">登录</button>
    </form>

    <!-- 激励标语 -->
    <div class="motivation">
      <p class="motivation-text">
        完成任务，赚取积分，兑换心仪礼物！<br>
        加油，小小努力家！
      </p>
    </div>

    <!-- 底部装饰 -->
    <div class="wave-decoration"></div>
  </div>
</body>
</html>
