<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统计页 - 家长端</title>
  <link href="https://cdn.jsdelivr.net/npm/smiley-sans@1.1.1/dist/SmileySans-Oblique.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-primary: #5B7FFF;
      --color-primary-light: #7B9FFF;
      --color-secondary: #34D399;
      --color-success: #34D399;
      --color-error: #EF4444;
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --text-muted: #9CA3AF;
      --bg-card: #FFFFFF;
      --radius-card: 12px;
      --radius-button: 8px;
      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.08);
      --nav-height: 56px;
    }

    body {
      font-family: 'Smiley Sans Oblique', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #F0F4FF 0%, #E8F0FE 50%, #F5F7FF 100%);
      padding-bottom: var(--nav-height);
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%235B7FFF' fill-opacity='0.03'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .page-content {
      padding: 16px;
      position: relative;
      z-index: 1;
    }

    /* 页面标题 */
    .page-header {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-header-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #5B7FFF 0%, #7B9FFF 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(91, 127, 255, 0.2);
    }

    .page-header-icon svg {
      width: 20px;
      height: 20px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    .page-title {
      font-size: 18px;
      color: var(--text-primary);
      font-weight: 600;
    }

    .page-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* 孩子概览卡片横向滑动 */
    .children-overview {
      margin-bottom: 20px;
    }

    .children-scroll {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }

    .children-scroll::-webkit-scrollbar {
      display: none;
    }

    .child-card {
      min-width: 150px;
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow:
        var(--shadow-card),
        0 1px 2px rgba(0, 0, 0, 0.04);
      border: 1px solid #E5E7EB;
      cursor: pointer;
      transition: all 0.2s ease-out;
    }

    .child-card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    .child-card.selected {
      border-color: var(--color-primary);
      background: linear-gradient(135deg, #F0F4FF 0%, #E8F0FE 100%);
      box-shadow: 0 4px 16px rgba(91, 127, 255, 0.15);
    }

    .child-avatar {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #F0F4FF 0%, #E8F0FE 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }

    .child-avatar svg {
      width: 18px;
      height: 18px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    .child-name {
      font-size: 16px;
      color: var(--text-primary);
      font-weight: 600;
      text-align: center;
      margin-bottom: 14px;
    }

    .child-stats {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .stat-label {
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-label svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-secondary);
      stroke-width: 2;
      fill: none;
    }

    .stat-value {
      color: var(--color-primary);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stat-value svg {
      width: 12px;
      height: 12px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    /* 记录详情区域 */
    .records-section {
      background: white;
      border-radius: var(--radius-card);
      box-shadow:
        var(--shadow-card),
        0 1px 2px rgba(0, 0, 0, 0.04);
      border: 1px solid #E5E7EB;
    }

    .record-group {
      border-bottom: 1px solid #E5E7EB;
    }

    .record-group:last-child {
      border-bottom: none;
    }

    .record-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      cursor: pointer;
      background: #F9FAFB;
      transition: all 0.15s;
    }

    .record-header.expanded {
      background: linear-gradient(135deg, #F0F4FF 0%, #E8F0FE 100%);
    }

    .record-header-title {
      font-size: 15px;
      color: var(--text-primary);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .record-header-title svg {
      width: 16px;
      height: 16px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    .record-header-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease-out;
    }

    .record-header-icon svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-muted);
      stroke-width: 2;
      fill: none;
    }

    .record-header.expanded .record-header-icon {
      transform: rotate(180deg);
    }

    .record-list {
      padding: 0 18px;
    }

    .record-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #E5E7EB;
    }

    .record-item:last-child {
      border-bottom: none;
    }

    .record-info {
      flex: 1;
    }

    .record-name {
      font-size: 14px;
      color: var(--text-primary);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .record-name svg {
      width: 16px;
      height: 16px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    .record-time {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .record-time svg {
      width: 12px;
      height: 12px;
      stroke: var(--text-muted);
      stroke-width: 2;
      fill: none;
    }

    .record-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .record-points {
      font-size: 14px;
      color: var(--color-primary);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .record-points svg {
      width: 14px;
      height: 14px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    .undo-btn {
      background: white;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease-out;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .undo-btn svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-secondary);
      stroke-width: 2;
      fill: none;
      transition: stroke 0.15s;
    }

    .undo-btn:hover {
      border-color: var(--color-error);
      color: var(--color-error);
    }

    .undo-btn:hover svg {
      stroke: var(--color-error);
    }

    /* 周统计 */
    .week-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: #F9FAFB;
    }

    .summary-text {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .summary-text svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-secondary);
      stroke-width: 2;
      fill: none;
    }

    .summary-value {
      font-size: 14px;
      color: var(--color-primary);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .summary-value svg {
      width: 14px;
      height: 14px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    /* 底部导航 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow:
        0 -4px 16px rgba(0, 0, 0, 0.08),
        0 -1px 2px rgba(0, 0, 0, 0.04);
      border-top: 1px solid #E5E7EB;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.15s ease-out;
      position: relative;
    }

    .nav-item::before {
      content: '';
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 3px;
      background: var(--color-primary);
      border-radius: 3px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .nav-item.active::before {
      opacity: 1;
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    .nav-icon svg {
      width: 24px;
      height: 24px;
      stroke: var(--text-muted);
      stroke-width: 1.5;
      fill: none;
      transition: stroke 0.15s ease-out;
    }

    .nav-item.active .nav-icon svg {
      stroke: var(--color-primary);
    }

    .nav-item:hover .nav-icon {
      transform: translateY(-2px);
    }

    .nav-label {
      font-size: 12px;
      color: var(--text-muted);
      transition: color 0.15s ease-out;
    }

    .nav-item.active .nav-label {
      color: var(--color-primary);
      font-weight: 600;
    }

    /* 确认撤销弹窗 */
    .undo-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border-radius: 16px;
      padding: 28px;
      width: 90%;
      max-width: 320px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
      z-index: 201;
      display: none;
    }

    .undo-popup.show {
      display: block;
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .popup-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #FEF2F2 0%, #FEE2E2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .popup-icon svg {
      width: 24px;
      height: 24px;
      stroke: var(--color-error);
      stroke-width: 2;
      fill: none;
    }

    .popup-title {
      font-size: 16px;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .popup-content {
      text-align: center;
      margin-bottom: 24px;
      background: #F9FAFB;
      border-radius: 12px;
      padding: 16px;
    }

    .popup-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      font-size: 14px;
    }

    .popup-label {
      color: var(--text-secondary);
    }

    .popup-value {
      color: var(--text-primary);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .popup-value svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-primary);
      stroke-width: 2;
      fill: none;
    }

    .popup-value.deduct {
      color: var(--color-error);
    }

    .popup-value.deduct svg {
      stroke: var(--color-error);
    }

    .popup-buttons {
      display: flex;
      gap: 12px;
    }

    .popup-btn-cancel {
      flex: 1;
      background: white;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }

    .popup-btn-cancel:hover {
      border-color: var(--text-muted);
    }

    .popup-btn-confirm {
      flex: 1;
      background: var(--color-error);
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.2);
      transition: all 0.15s;
    }

    .popup-btn-confirm:hover {
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.3);
      z-index: 200;
      display: none;
      backdrop-filter: blur(2px);
    }

    .overlay.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="page-content">
    <!-- 页面标题 -->
    <div class="page-header">
      <div class="page-header-icon">
        <!-- BarChart3 icon -->
        <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
      </div>
      <div>
        <div class="page-title">本周统计</div>
        <div class="page-subtitle">5月19日 - 5月25日</div>
      </div>
    </div>

    <!-- 孩子概览卡片 -->
    <div class="children-overview">
      <div class="children-scroll">
        <div class="child-card selected">
          <div class="child-avatar">
            <!-- Smile icon -->
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          </div>
          <div class="child-name">小明</div>
          <div class="child-stats">
            <div class="stat-item">
              <div class="stat-label">
                <!-- CheckCircle icon -->
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>
                完成
              </div>
              <div class="stat-value">5 个</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">
                <!-- TrendingUp icon -->
                <svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                获得
              </div>
              <div class="stat-value">
                <!-- Star icon -->
                <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                +45 积分
              </div>
            </div>
          </div>
        </div>

        <div class="child-card">
          <div class="child-avatar">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          </div>
          <div class="child-name">小红</div>
          <div class="child-stats">
            <div class="stat-item">
              <div class="stat-label">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>
                完成
              </div>
              <div class="stat-value">3 个</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">
                <svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                获得
              </div>
              <div class="stat-value">
                <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                +25 积分
              </div>
            </div>
          </div>
        </div>

        <div class="child-card">
          <div class="child-avatar">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          </div>
          <div class="child-name">小刚</div>
          <div class="child-stats">
            <div class="stat-item">
              <div class="stat-label">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>
                完成
              </div>
              <div class="stat-value">2 个</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">
                <svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                获得
              </div>
              <div class="stat-value">
                <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                +15 积分
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 记录详情区域 -->
    <div class="records-section">
      <!-- 小明本周记录（展开） -->
      <div class="record-group">
        <div class="record-header expanded">
          <div class="record-header-title">
            <!-- User icon -->
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
            小明本周记录
          </div>
          <div class="record-header-icon">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
        <div class="record-list">
          <div class="record-item">
            <div class="record-info">
              <div class="record-name">
                <!-- BookOpen icon -->
                <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3 3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3 3h7z"/></svg>
                阅读书籍
              </div>
              <div class="record-time">
                <!-- Clock icon -->
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                5月21日 09:30
              </div>
            </div>
            <div class="record-meta">
              <div class="record-points">
                <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                +10
              </div>
              <button class="undo-btn" onclick="showUndoPopup()">
                <!-- Undo2 icon -->

                撤销
              </button>
            </div>
          </div>
          <div class="record-item">
            <div class="record-info">
              <div class="record-name">
                <!-- Sparkles icon -->
                <svg viewBox="0 0 24 24"><path d="M12 3l1.912 5.813 6.088-1.913-3.5 3.5 3.5 3.5-6.088-1.913L12 21l-1.912-5.813L4 17l3.5-3.5L4 10l6.088 1.913L12 3z"/></svg>
                整理房间
              </div>

                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                5月20日 15:20
              </div>
            </div>
            <div class="record-meta">
              <div class="record-points">
                <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                +5
