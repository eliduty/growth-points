<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统计页 - 家长端</title>
  <link href="https://cdn.jsdelivr.net/npm/smiley-sans@1.1.1/dist/SmileySans-Oblique.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-primary: #5B7FFF;
      --color-primary-light: #7B9FFF;
      --color-secondary: #34D399;
      --color-success: #34D399;
      --color-error: #EF4444;
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --text-muted: #9CA3AF;
      --bg-card: #FFFFFF;
      --radius-card: 12px;
      --radius-button: 8px;
      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.08);
      --nav-height: 56px;
    }

    body {
      font-family: 'Smiley Sans Oblique', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #F0F4FF 0%, #E8F0FE 50%, #F5F7FF 100%);
      padding-top: 56px;
      padding-bottom: var(--nav-height);
      position: relative;
    }

    /* 顶部导航栏 */
    .top-nav {
      height: 56px;
      background: white;
      border-bottom: 1px solid #E5E7EB;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      box-shadow: 0 2px 8px rgba(91, 127, 255, 0.04);
    }

    .nav-back {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 150ms ease-out;
      border-radius: 8px;
    }

    .nav-back:hover {
      background: #F5F7FF;
    }

    .nav-back svg {
      width: 24px;
      height: 24px;
      stroke: var(--text-primary);
      stroke-width: 2;
      fill: none;
    }

    .nav-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .nav-action {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%235B7FFF' fill-opacity='0.03'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .page-content {
      padding: 16px;
      position: relative;
      z-index: 1;
    }

    /* 页面标题 */
    .page-header {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-header-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #5B7FFF 0%, #7B9FFF 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(91, 127, 255, 0.2);
    }

    .page-header-icon svg {
      width: 20px;
      height: 20px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    .page-title {
      font-size: 18px;
      color: var(--text-primary);
      font-weight: 600;
    }

    .page-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* 孩子概览卡片横向滑动 */
    .children-overview {
      margin-bottom: 20px;
    }

    .children-scroll {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }

    .children-scroll::-webkit-scrollbar {
      display: none;
    }

    .child-card {
      min-width: 150px;
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow:
        var(--shadow-card),
        0 1px 2px rgba(0, 0, 0, 0.04);
      border: 1px solid #E5E7EB;
      cursor: pointer;
      transition: all 0.2s ease-out;
    }

    .child-card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    .child-card.selected {
      border-color: var(--color-primary);
      background: linear-gradient(135deg, #F0F4FF 0%, #E8F0FE 100%);
      box-shadow: 0 4px 16px rgba(91, 127, 255, 0.15);
    }

    .child-avatar {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #F0F4FF 0%, #E8F0FE 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }

    .child-avatar svg {
      width: 18px;
      height: 18px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    .child-name {
      font-size: 16px;
      color: var(--text-primary);
      font-weight: 600;
      text-align: center;
      margin-bottom: 14px;
    }

    .child-stats {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .stat-label {
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-label svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-secondary);
      stroke-width: 2;
      fill: none;
    }

    .stat-value {
      color: var(--color-primary);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stat-value svg {
      width: 12px;
      height: 12px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    /* 记录详情区域 */
    .records-section {
      background: white;
      border-radius: var(--radius-card);
      box-shadow:
        var(--shadow-card),
        0 1px 2px rgba(0, 0, 0, 0.04);
      border: 1px solid #E5E7EB;
    }

    .record-group {
      border-bottom: 1px solid #E5E7EB;
    }

    .record-group:last-child {
      border-bottom: none;
    }

    .record-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      cursor: pointer;
      background: #F9FAFB;
      transition: all 0.15s;
    }

    .record-header.expanded {
      background: linear-gradient(135deg, #F0F4FF 0%, #E8F0FE 100%);
    }

    .record-header-title {
      font-size: 15px;
      color: var(--text-primary);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .record-header-title svg {
      width: 16px;
      height: 16px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    .record-header-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease-out;
    }

    .record-header-icon svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-muted);
      stroke-width: 2;
      fill: none;
    }

    .record-header.expanded .record-header-icon {
      transform: rotate(180deg);
    }

    .record-list {
      padding: 0 18px;
    }

    .record-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #E5E7EB;
    }

    .record-item:last-child {
      border-bottom: none;
    }

    .record-info {
      flex: 1;
    }

    .record-name {
      font-size: 14px;
      color: var(--text-primary);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .record-name svg {
      width: 16px;
      height: 16px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    .record-time {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .record-time svg {
      width: 12px;
      height: 12px;
      stroke: var(--text-muted);
      stroke-width: 2;
      fill: none;
    }

    .record-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .record-points {
      font-size: 14px;
      color: var(--color-primary);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .record-points svg {
      width: 14px;
      height: 14px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    .undo-btn {
      background: white;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease-out;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .undo-btn svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-secondary);
      stroke-width: 2;
      fill: none;
      transition: stroke 0.15s;
    }

    .undo-btn:hover {
      border-color: var(--color-error);
      color: var(--color-error);
    }

    .undo-btn:hover svg {
      stroke: var(--color-error);
    }

    /* 周统计 */
    .week-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: #F9FAFB;
    }

    .summary-text {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .summary-text svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-secondary);
      stroke-width: 2;
      fill: none;
    }

    .summary-value {
      font-size: 14px;
      color: var(--color-primary);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .summary-value svg {
      width: 14px;
      height: 14px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    /* 底部导航 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow:
        0 -4px 16px rgba(0, 0, 0, 0.08),
        0 -1px 2px rgba(0, 0, 0, 0.04);
      border-top: 1px solid #E5E7EB;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.15s ease-out;
      position: relative;
    }

    .nav-item::before {
      content: '';
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 3px;
      background: var(--color-primary);
      border-radius: 3px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .nav-item.active::before {
      opacity: 1;
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    .nav-icon svg {
      width: 24px;
      height: 24px;
      stroke: var(--text-muted);
      stroke-width: 1.5;
      fill: none;
      transition: stroke 0.15s ease-out;
    }

    .nav-item.active .nav-icon svg {
      stroke: var(--color-primary);
    }

    .nav-item:hover .nav-icon {
      transform: translateY(-2px);
    }

    .nav-label {
      font-size: 12px;
      color: var(--text-muted);
      transition: color 0.15s ease-out;
    }

    .nav-item.active .nav-label {
      color: var(--color-primary);
      font-weight: 600;
    }

    /* 确认撤销弹窗 */
    .undo-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border-radius: 16px;
      padding: 28px;
      width: 90%;
      max-width: 320px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
      z-index: 201;
      display: none;
    }

    .undo-popup.show {
      display: block;
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .popup-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #FEF2F2 0%, #FEE2E2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .popup-icon svg {
      width: 24px;
      height: 24px;
      stroke: var(--color-error);
      stroke-width: 2;
      fill: none;
    }

    .popup-title {
      font-size: 16px;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .popup-content {
      text-align: center;
      margin-bottom: 24px;
      background: #F9FAFB;
      border-radius: 12px;
      padding: 16px;
    }

    .popup-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      font-size: 14px;
    }

    .popup-label {
      color: var(--text-secondary);
    }

    .popup-value {
      color: var(--text-primary);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .popup-value svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-primary);
      stroke-width: 2;
      fill: none;
    }

    .popup-value.deduct {
      color: var(--color-error);
    }

    .popup-value.deduct svg {
      stroke: var(--color-error);
    }

    .popup-buttons {
      display: flex;
      gap: 12px;
    }

    .popup-btn-cancel {
      flex: 1;
      background: white;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }

    .popup-btn-cancel:hover {
      border-color: var(--text-muted);
    }

    .popup-btn-confirm {
      flex: 1;
      background: var(--color-error);
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.2);
      transition: all 0.15s;
    }

    .popup-btn-confirm:hover {
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.3);
      z-index: 200;
      display: none;
      backdrop-filter: blur(2px);
    }

    .overlay.show {
      display: block;
    }

    /* 奖励积分按钮 */
    .reward-btn {
      width: 100%;
      background: linear-gradient(135deg, #34D399 0%, #10B981 100%);
      border: none;
      border-radius: 10px;
      padding: 12px;
      margin-top: 14px;
      font-size: 14px;
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(34, 211, 153, 0.25);
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .reward-btn svg {
      width: 16px;
      height: 16px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    .reward-btn:hover {
      box-shadow: 0 4px 12px rgba(34, 211, 153, 0.35);
      transform: translateY(-1px);
    }

    /* 奖励表单弹窗 */
    .reward-dialog {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border-radius: 20px;
      padding: 24px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
      z-index: 201;
      display: none;
    }

    .reward-dialog.show {
      display: block;
      animation: popIn 0.2s ease-out;
    }

    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .dialog-title {
      font-size: 18px;
      color: var(--text-primary);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dialog-title svg {
      width: 20px;
      height: 20px;
      stroke: #34D399;
      stroke-width: 2;
      fill: none;
    }

    .dialog-close {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .dialog-close:hover {
      background: #F3F4F6;
    }

    .dialog-close svg {
      width: 18px;
      height: 18px;
      stroke: var(--text-muted);
      stroke-width: 2;
      fill: none;
    }

    /* 预设档位 */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .preset-btn {
      background: #F3F4F6;
      border: 2px solid #E5E7EB;
      border-radius: 12px;
      padding: 14px 8px;
      font-size: 14px;
      color: var(--text-primary);
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      transition: all 0.15s;
      text-align: center;
    }

    .preset-btn:hover {
      border-color: #34D399;
      background: #ECFDF5;
    }

    .preset-btn.selected {
      border-color: #34D399;
      background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%);
      color: #059669;
    }

    .preset-value {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .preset-value svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    /* 自定义输入 */
    .custom-input-group {
      margin-bottom: 16px;
    }

    .input-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-label svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-secondary);
      stroke-width: 2;
      fill: none;
    }

    .custom-input {
      width: 100%;
      border: 2px solid #E5E7EB;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 16px;
      color: var(--text-primary);
      font-family: inherit;
      font-weight: 600;
      transition: all 0.15s;
      outline: none;
    }

    .custom-input:focus {
      border-color: #34D399;
      background: #ECFDF5;
    }

    .custom-input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    /* 原因输入 */
    .reason-input {
      width: 100%;
      border: 2px solid #E5E7EB;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      color: var(--text-primary);
      font-family: inherit;
      transition: all 0.15s;
      outline: none;
      resize: none;
      min-height: 60px;
    }

    .reason-input:focus {
      border-color: #34D399;
      background: #ECFDF5;
    }

    .reason-input::placeholder {
      color: var(--text-muted);
    }

    .char-count {
      font-size: 12px;
      color: var(--text-muted);
      text-align: right;
      margin-top: 4px;
    }

    /* 提交按钮 */
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #34D399 0%, #10B981 100%);
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(34, 211, 153, 0.25);
      transition: all 0.15s;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn svg {
      width: 18px;
      height: 18px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    .submit-btn:hover {
      box-shadow: 0 4px 12px rgba(34, 211, 153, 0.35);
    }

    .submit-btn:disabled {
      background: #E5E7EB;
      color: var(--text-muted);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* 二次确认弹窗 */
    .confirm-popup {
      position: fixed;
      top: 50%;
      left: 50%;

    </div>
  </div>

  <script>
    // 原有撤销弹窗逻辑
    function showUndoPopup() {
      document.getElementById('overlay').classList.add('show');
      document.getElementById('undoPopup').classList.add('show');
    }

    function hideUndoPopup() {
      document.getElementById('overlay').classList.remove('show');
      document.getElementById('undoPopup').classList.remove('show');
    }

    function confirmUndo() {
      hideUndoPopup();
      alert('已撤销');
    }

    // 奖励表单逻辑
    let selectedPreset = null;

    function showRewardDialog() {
      document.getElementById('overlay').classList.add('show');
      document.getElementById('rewardDialog').classList.add('show');
    }

    function hideRewardDialog() {
      document.getElementById('overlay').classList.remove('show');
      document.getElementById('rewardDialog').classList.remove('show');
      // 重置表单
      selectedPreset = null;
      document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('selected'));
      document.getElementById('customPoints').value = '';
      document.getElementById('rewardReason').value = '';
      document.getElementById('charCount').textContent = '0';
      document.getElementById('submitBtn').disabled = true;
    }

    function selectPreset(value) {
      selectedPreset = value;
      document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('selected'));
      event.target.closest('.preset-btn').classList.add('selected');
      document.getElementById('customPoints').value = value;
      checkFormValidity();
    }

    function updatePresetSelection() {
      const value = parseInt(document.getElementById('customPoints').value);
      document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('selected'));
      if ([10, 20, 50, 100].includes(value)) {
        document.querySelectorAll('.preset-btn')[[10, 20, 50, 100].indexOf(value)].classList.add('selected');
        selectedPreset = value;
      } else {
        selectedPreset = null;
      }
      checkFormValidity();
    }

    function updateCharCount() {
      const reason = document.getElementById('rewardReason').value;
      document.getElementById('charCount').textContent = reason.length;
      checkFormValidity();
    }

    function checkFormValidity() {
      const points = parseInt(document.getElementById('customPoints').value);
      const reason = document.getElementById('rewardReason').value.trim();
      const isValid = points > 0 && reason.length > 0;
      document.getElementById('submitBtn').disabled = !isValid;
    }

    // 二次确认弹窗逻辑
    function showConfirmPopup() {
      const points = document.getElementById('customPoints').value;
      const reason = document.getElementById('rewardReason').value;

      document.getElementById('confirmPoints').querySelector('span').textContent = points;
      document.getElementById('confirmReason').textContent = reason;

      document.getElementById('rewardDialog').classList.remove('show');
      document.getElementById('confirmPopup').classList.add('show');
    }

    function hideConfirmPopup() {
      document.getElementById('confirmPopup').classList.remove('show');
      document.getElementById('rewardDialog').classList.add('show');
    }

    function confirmReward() {
      const points = document.getElementById('confirmPoints').querySelector('span').textContent;
      hideConfirmPopup();
      hideRewardDialog();
      alert(`已奖励 ${points} 积分`);
    }
  </script>
</body>
</html>
