<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>礼物页 - 孩子端</title>
  <link href="https://cdn.jsdelivr.net/npm/smiley-sans@1.1.1/dist/SmileySans-Oblique.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-primary: #FF6B35;
      --color-primary-light: #FF8A50;
      --color-secondary: #4ECDC4;
      --color-accent: #FFD93D;
      --color-success: #4ECDC4;
      --color-error: #FF6B6B;
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --text-muted: #9CA3AF;
      --bg-card: #FFFFFF;
      --radius-card: 16px;
      --radius-button: 12px;
      --shadow-card: 0 4px 12px rgba(255, 107, 53, 0.15);
      --nav-height: 56px;
    }

    body {
      font-family: 'Smiley Sans Oblique', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #FFF8F0 0%, #FFEDD8 50%, #FFFBE8 100%);
      padding-top: 56px;
      padding-bottom: var(--nav-height);
      position: relative;
    }

    /* 顶部导航栏 */
    .top-nav {
      height: 56px;
      background: linear-gradient(135deg, #FF6B35 0%, #FF8A50 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      box-shadow: 0 2px 8px rgba(255, 107, 53, 0.15);
    }

    .nav-back {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 150ms ease-out;
      border-radius: 8px;
    }

    .nav-back:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .nav-back svg {
      width: 24px;
      height: 24px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    .nav-title {
      font-size: 18px;
      font-weight: 600;
      color: white;
    }

    .nav-action {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23FFD93D' fill-opacity='0.05'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .page-content {
      padding: 16px;
      position: relative;
      z-index: 1;
    }

    /* 兑换日提示 */
    .redeem-info {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow:
        var(--shadow-card),
        0 1px 2px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 107, 53, 0.08);
    }

    .redeem-days {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .redeem-label {
      font-size: 14px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .redeem-label svg {
      width: 16px;
      height: 16px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    .redeem-value {
      font-size: 16px;
      color: var(--text-primary);
      font-weight: 600;
    }

    .redeem-countdown {
      background: linear-gradient(135deg, #FFF8F0 0%, #FFEDD8 100%);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      border: 1px solid rgba(255, 107, 53, 0.1);
    }

    .countdown-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .countdown-value {
      font-size: 22px;
      color: var(--color-primary);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .countdown-value svg {
      width: 20px;
      height: 20px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    /* 兑换日当天提示 */
    .redeem-today {
      background: linear-gradient(135deg, #FF6B35 0%, #FF8A50 100%);
      color: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      box-shadow:
        0 6px 20px rgba(255, 107, 53, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .redeem-today::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 50%);
      animation: rotate 10s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .redeem-today svg {
      width: 24px;
      height: 24px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    /* 礼物网格 */
    .gift-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .gift-card {
      background: var(--bg-card);
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        var(--shadow-card),
        0 1px 2px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease-out;
      cursor: pointer;
      position: relative;
    }

    .gift-card:hover {
      transform: translateY(-4px);
      box-shadow:
        0 8px 20px rgba(255, 107, 53, 0.2),
        0 4px 8px rgba(0, 0, 0, 0.06);
    }

    .gift-card.disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .gift-card.disabled:hover {
      transform: none;
      box-shadow: var(--shadow-card);
    }

    /* 礼物颜色背景 */
    .gift-bg {
      padding: 28px 16px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .gift-bg::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15) 0%, transparent 50%);
    }

    .gift-bg-orange { background: linear-gradient(135deg, #FF6B35 0%, #FF8A50 100%); }
    .gift-bg-teal { background: linear-gradient(135deg, #4ECDC4 0%, #7FDBDA 100%); }
    .gift-bg-yellow { background: linear-gradient(135deg, #FFD93D 0%, #FFE066 100%); }
    .gift-bg-blue { background: linear-gradient(135deg, #60A5FA 0%, #93C5FD 100%); }
    .gift-bg-purple { background: linear-gradient(135deg, #A78BFA 0%, #C4B5FD 100%); }
    .gift-bg-orange2 { background: linear-gradient(135deg, #FB923C 0%, #FDBA74 100%); }

    .gift-bg-icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 12px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gift-bg-icon svg {
      width: 22px;
      height: 22px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    .gift-name-bg {
      font-size: 18px;
      color: white;
      font-weight: 600;
      position: relative;
    }

    .gift-info {
      padding: 16px;
      text-align: center;
      background: white;
    }

    .gift-points {
      font-size: 16px;
      color: var(--color-primary);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .gift-points svg {
      width: 16px;
      height: 16px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    /* 确认兑换弹窗 */
    .redeem-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border-radius: 24px;
      padding: 28px;
      width: 90%;
      max-width: 320px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
      z-index: 201;
      display: none;
    }

    .redeem-popup.show {
      display: block;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .redeem-popup-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #FF6B35 0%, #FF8A50 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.2);
    }

    .redeem-popup-icon svg {
      width: 28px;
      height: 28px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    .redeem-popup-title {
      font-size: 18px;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .redeem-popup-content {
      text-align: center;
      margin-bottom: 24px;
      background: #F9FAFB;
      border-radius: 16px;
      padding: 16px;
    }

    .redeem-popup-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      font-size: 15px;
    }

    .redeem-popup-label {
      color: var(--text-secondary);
    }

    .redeem-popup-value {
      color: var(--text-primary);
      font-weight: 500;
    }

    .redeem-popup-value.points-cost {
      color: var(--color-primary);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .redeem-popup-value.points-cost svg {
      width: 14px;
      height: 14px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    .redeem-popup-buttons {
      display: flex;
      gap: 12px;
    }

    .redeem-btn-cancel {
      flex: 1;
      background: white;
      border: 2px solid #E5E7EB;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }

    .redeem-btn-cancel:hover {
      border-color: var(--text-muted);
    }

    .redeem-btn-ok {
      flex: 1;
      background: linear-gradient(135deg, #FF6B35 0%, #FF8A50 100%);
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.2);
      transition: all 0.15s;
    }

    .redeem-btn-ok:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(255, 107, 53, 0.3);
    }

    /* 等待确认提示 */
    .waiting-toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, #4ECDC4 0%, #7FDBDA 100%);
      color: white;
      padding: 24px 48px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 12px 32px rgba(78, 205, 196, 0.35);
      z-index: 202;
      display: none;
    }

    .waiting-toast.show {
      display: flex;
      align-items: center;
      gap: 12px;
      animation: toastPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), toastFade 0.5s ease-out 1.5s forwards;
    }

    .waiting-toast svg {
      width: 24px;
      height: 24px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    @keyframes toastPop {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      60% { transform: translate(-50%, -50%) scale(1.1); }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    @keyframes toastFade {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* 遮罩层 */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 200;
      display: none;
      backdrop-filter: blur(2px);
    }

    .overlay.show {
      display: block;
    }

    /* 底部导航 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow:
        0 -4px 16px rgba(0, 0, 0, 0.08),
        0 -1px 2px rgba(0, 0, 0, 0.04);
      border-top: 1px solid #E5E7EB;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      cursor: pointer;
      transition: all 0.15s ease-out;
      position: relative;
    }

    .nav-item::before {
      content: '';
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 3px;
      background: var(--color-primary);
      border-radius: 3px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .nav-item.active::before {
      opacity: 1;
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    .nav-icon svg {
      width: 24px;
      height: 24px;
      stroke: var(--text-muted);
      stroke-width: 1.5;
      fill: none;
      transition: stroke 0.15s ease-out;
    }

    .nav-item.active .nav-icon svg {
      stroke: var(--color-primary);
    }

    .nav-item:hover .nav-icon {
      transform: translateY(-2px);
    }

    .nav-label {
      font-size: 12px;
      color: var(--text-muted);
      transition: color 0.15s ease-out;
    }

    .nav-item.active .nav-label {
      color: var(--color-primary);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- 顶部导航栏 -->
  <div class="top-nav">
    <div class="nav-back">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div class="nav-title">礼物兑换</div>
    <div class="nav-action"></div>
  </div>

  <div class="page-content">
    <!-- 兑换日提示 -->
    <div class="redeem-info">
      <div class="redeem-days">
        <div class="redeem-label">
          <!-- Calendar icon -->
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          本周兑换日：
        </div>
        <div class="redeem-value">周三、周六</div>
      </div>
      <div class="redeem-countdown">
        <div class="countdown-label">下次兑换还剩</div>
        <div class="countdown-value">
          <!-- Hourglass icon -->
          <svg viewBox="0 0 24 24"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.828V2"/><circle cx="12" cy="12" r="1"/></svg>
          2 天
        </div>
      </div>
    </div>

    <!-- 礼物网格 -->
    <div class="gift-grid">
      <div class="gift-card disabled" onclick="showDisabledToast()">
        <div class="gift-bg gift-bg-orange">
          <div class="gift-bg-icon">
            <!-- Car icon -->
            <svg viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 3.6C2.1 11.3 2 11.8 2 12.4V16c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
          </div>
          <div class="gift-name-bg">玩具车</div>
        </div>
        <div class="gift-info">
          <div class="gift-points">
            <!-- Star icon -->
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            50 积分
          </div>
        </div>
      </div>

      <div class="gift-card disabled" onclick="showDisabledToast()">
        <div class="gift-bg gift-bg-teal">
          <div class="gift-bg-icon">
            <!-- BookOpen icon -->
            <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3 3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3 3h7z"/></svg>
          </div>
          <div class="gift-name-bg">绘本</div>
        </div>
        <div class="gift-info">
          <div class="gift-points">
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            30 积分
          </div>
        </div>
      </div>

      <div class="gift-card disabled" onclick="showDisabledToast()">
        <div class="gift-bg gift-bg-yellow">
          <div class="gift-bg-icon">
            <!-- IceCream icon -->
            <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v3H5a2 2 0 0 0 0 4h1.5l.5 6a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l.5-6H19a2 2 0 0 0 0-4h-2V7a5 5 0 0 0-5-5z"/><path d="M12 2a5 5 0 0 1 5 5"/><path d="M7 10h10"/></svg>
          </div>
          <div class="gift-name-bg">冰淇淋</div>
        </div>
        <div class="gift-info">
          <div class="gift-points">
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            20 积分
          </div>
        </div>
      </div>

      <div class="gift-card disabled" onclick="showDisabledToast()">
        <div class="gift-bg gift-bg-blue">
          <div class="gift-bg-icon">
            <!-- Film icon -->
            <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
          </div>
          <div class="gift-name-bg">电影票</div>
        </div>
        <div class="gift-info">
          <div class="gift-points">
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            100 积分
          </div>
        </div>
      </div>

      <div class="gift-card disabled" onclick="showDisabledToast()">
        <div class="gift-bg gift-bg-purple">
          <div class="gift-bg-icon">
            <!-- Cuboid icon (approximation for Lego) -->
            <svg viewBox="0 0 24 24"><path d="M2 7l10-5 10 5-10 5-10-5z"/><path d="M2 17l10-5 10 5-10 5-10-5z"/><path d="M2 7v10"/><path d="M22 7v10"/></svg>
          </div>
          <div class="gift-name-bg">乐高积木</div>
        </div>
        <div class="gift-info">
          <div class="gift-points">
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            80 积分
          </div>
        </div>
      </div>

      <div class="gift-card disabled" onclick="showDisabledToast()">
        <div class="gift-bg gift-bg-orange2">
          <div class="gift-bg-icon">
            <!-- Cookie icon -->
            <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"/><path d="M8.5 8.5v.01"/><path d="M16 15.5v.01"/><path d="M12 12v.01"/><path d="M11 17v.01"/><path d="M7 14v.01"/><path d="M16 8v.01"/></svg>
          </div>

    </div>
    <div class="redeem-popup-title">确认兑换礼物？</div>
    <div class="redeem-popup-content">
      <div class="redeem-popup-item">
        <div class="redeem-popup-label">礼物</div>
        <div class="redeem-popup-value">绘本</div>
      </div>
      <div class="redeem-popup-item">
        <div class="redeem-popup-label">需扣积分</div>
        <div class="redeem-popup-value points-cost">

    <div class="redeem-popup-buttons">
      <button class="redeem-btn-cancel" onclick="hideRedeem()">取消</button>
      <button class="redeem-btn-ok" onclick="confirmRedeem()">确认兑换</button>
    </div>
  </div>

  <!-- 等待确认提示 -->
  <div class="waiting-toast" id="waitingToast">

  </div>

  <script>
    function showDisabledToast() {
      alert('兑换日才能兑换哦~');
    }

    function showRedeem() {
      document.getElementById('overlay').classList.add('show');
      document.getElementById('redeemPopup').classList.add('show');
    }

    function hideRedeem() {
      document.getElementById('overlay').classList.remove('show');
      document.getElementById('redeemPopup').classList.remove('show');
    }

    function confirmRedeem() {
      hideRedeem();
      const toast = document.getElementById('waitingToast');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }
  </script>
