<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置页 - 家长端</title>
  <link href="https://cdn.jsdelivr.net/npm/smiley-sans@1.1.1/dist/SmileySans-Oblique.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-primary: #5B7FFF;
      --color-primary-light: #7B9FFF;
      --color-secondary: #34D399;
      --color-success: #34D399;
      --color-error: #EF4444;
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --text-muted: #9CA3AF;
      --bg-card: #FFFFFF;
      --radius-card: 12px;
      --radius-button: 8px;
      --radius-input: 8px;
      --shadow-card: 0 2px 8px rgba(91, 127, 255, 0.08), 0 1px 2px rgba(91, 127, 255, 0.04);
      --nav-height: 56px;
    }

    body {
      font-family: 'Smiley Sans Oblique', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #F0F4FF 0%, #E8F0FE 50%, #F5F7FF 100%);
      padding-top: 56px;
      padding-bottom: var(--nav-height);
      position: relative;
    }

    /* 顶部导航栏 */
    .top-nav {
      height: 56px;
      background: white;
      border-bottom: 1px solid #E5E7EB;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      box-shadow: 0 2px 8px rgba(91, 127, 255, 0.04);
    }

    .nav-back {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 150ms ease-out;
      border-radius: 8px;
    }

    .nav-back:hover {
      background: #F5F7FF;
    }

    .nav-back svg {
      width: 24px;
      height: 24px;
      stroke: var(--text-primary);
      stroke-width: 2;
      fill: none;
    }

    .nav-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .nav-action {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    /* 背景纹理 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%235B7FFF' fill-opacity='0.05'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .page-content {
      padding: 16px;
      position: relative;
      z-index: 1;
    }

    /* 设置区块 */
    .settings-section {
      background: white;
      border-radius: var(--radius-card);
      margin-bottom: 16px;
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(91, 127, 255, 0.08);
      animation: fadeIn 0.4s ease-out backwards;
    }

    .settings-section:nth-child(1) { animation-delay: 0.1s; }
    .settings-section:nth-child(2) { animation-delay: 0.2s; }
    .settings-section:nth-child(3) { animation-delay: 0.3s; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-header {
      padding: 12px 16px;
      background: linear-gradient(135deg, #F9FAFB 0%, #F5F7FF 100%);
      border-radius: var(--radius-card) var(--radius-card) 0 0;
      font-size: 15px;
      color: var(--text-primary);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-header svg {
      width: 18px;
      height: 18px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    .section-content {
      padding: 16px;
    }

    /* 成员管理 */
    .member-group {
      margin-bottom: 16px;
    }

    .member-group:last-child {
      margin-bottom: 0;
    }

    .member-label {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .member-label svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-muted);
      stroke-width: 2;
      fill: none;
    }

    .member-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #E5E7EB;
    }

    .member-item:last-child {
      border-bottom: none;
    }

    .member-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .member-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #E8F0FE 0%, #F0F4FF 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .member-avatar svg {
      width: 18px;
      height: 18px;
      stroke: var(--color-primary);
      stroke-width: 1.5;
      fill: none;
    }

    .member-avatar.child {
      background: linear-gradient(135deg, #FFF0E8 0%, #FFE8DC 100%);
    }

    .member-avatar.child svg {
      stroke: #FF6B35;
    }

    .member-name {
      font-size: 14px;
      color: var(--text-primary);
    }

    .member-tag {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .member-btn {
      background: white;
      border: 1px solid #E5E7EB;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: inherit;
      transition: all 150ms ease-out;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .member-btn svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-secondary);
      stroke-width: 2;
      fill: none;
      transition: stroke 150ms ease-out;
    }

    .member-btn:hover {
      border-color: var(--color-error);
      color: var(--color-error);
    }

    .member-btn:hover svg {
      stroke: var(--color-error);
    }

    .member-btn.hidden {
      visibility: hidden;
    }

    .add-member-btn {
      background: linear-gradient(135deg, #5B7FFF 0%, #7B9FFF 100%);
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      margin-top: 12px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(91, 127, 255, 0.2);
      transition: all 150ms ease-out;
    }

    .add-member-btn svg {
      width: 18px;
      height: 18px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    .add-member-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(91, 127, 255, 0.25);
    }

    /* 兑换日设置 */
    .redeem-setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #E5E7EB;
    }

    .redeem-setting:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .redeem-label {
      font-size: 14px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .redeem-label svg {
      width: 16px;
      height: 16px;
      stroke: var(--text-secondary);
      stroke-width: 2;
      fill: none;
    }

    .redeem-value {
      font-size: 14px;
      color: var(--text-primary);
      font-weight: 500;
    }

    .redeem-btn {
      background: white;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      color: var(--color-primary);
      cursor: pointer;
      font-family: inherit;
      margin-top: 16px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 150ms ease-out;
    }

    .redeem-btn svg {
      width: 18px;
      height: 18px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
      transition: stroke 150ms ease-out;
    }

    .redeem-btn:hover {
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }

    .redeem-btn:hover svg {
      stroke: white;
    }

    /* 个人信息 */
    .info-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }

    .info-label {
      font-size: 14px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-label svg {
      width: 16px;
      height: 16px;
      stroke: var(--text-secondary);
      stroke-width: 2;
      fill: none;
    }

    .info-value {
      font-size: 14px;
      color: var(--text-primary);
    }

    /* 退出登录 */
    .logout-section {
      margin-top: 16px;
    }

    .logout-btn {
      width: 100%;
      background: white;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      padding: 16px;
      font-size: 16px;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: inherit;
      transition: all 150ms ease-out;
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .logout-btn svg {
      width: 20px;
      height: 20px;
      stroke: var(--text-secondary);
      stroke-width: 2;
      fill: none;
      transition: stroke 150ms ease-out;
    }

    .logout-btn:hover {
      border-color: var(--color-error);
      color: var(--color-error);
    }

    .logout-btn:hover svg {
      stroke: var(--color-error);
    }

    /* 弹窗样式 */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      z-index: 99;
      display: none;
    }

    .popup-overlay.show {
      display: block;
      animation: fadeInOverlay 200ms ease-out;
    }

    @keyframes fadeInOverlay {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border-radius: 16px;
      width: 90%;
      max-width: 340px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), 0 4px 16px rgba(91, 127, 255, 0.1);
      z-index: 100;
      display: none;
    }

    .popup.show {
      display: block;
      animation: popIn 200ms ease-out;
    }

    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .popup-header {
      padding: 16px;
      border-bottom: 1px solid #E5E7EB;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .popup-header svg {
      width: 20px;
      height: 20px;
      stroke: var(--color-primary);
      stroke-width: 2;
      fill: none;
    }

    .popup-title {
      font-size: 16px;
      color: var(--text-primary);
      font-weight: 600;
      text-align: center;
    }

    .popup-body {
      padding: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-label {
      display: block;
      font-size: 14px;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      height: 44px;
      border: 1px solid #E5E7EB;
      border-radius: var(--radius-input);
      padding: 12px 16px;
      font-size: 15px;
      font-family: inherit;
      background: #F9FAFB;
      transition: all 150ms ease-out;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--color-primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(91, 127, 255, 0.1);
    }

    .popup-footer {
      padding: 16px;
      display: flex;
      gap: 12px;
    }

    .popup-btn-cancel {
      flex: 1;
      background: white;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: inherit;
      transition: all 150ms ease-out;
    }

    .popup-btn-cancel:hover {
      background: #F9FAFB;
    }

    .popup-btn-confirm {
      flex: 1;
      background: linear-gradient(135deg, #5B7FFF 0%, #7B9FFF 100%);
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(91, 127, 255, 0.2);
      transition: all 150ms ease-out;
    }

    .popup-btn-confirm svg {
      width: 16px;
      height: 16px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    .popup-btn-confirm:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(91, 127, 255, 0.25);
    }

    /* 兑换日设置弹窗 */
    .weekday-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .weekday-item {
      background: #F9FAFB;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 150ms ease-out;
    }

    .weekday-item.selected {
      background: linear-gradient(135deg, #5B7FFF 0%, #7B9FFF 100%);
      border-color: var(--color-primary);
      color: white;
      box-shadow: 0 4px 12px rgba(91, 127, 255, 0.2);
    }

    .weekday-item:hover:not(.selected) {
      border-color: var(--color-primary);
      background: #F0F4FF;
    }

    /* 删除确认弹窗 */
    .delete-popup {
      padding: 24px;
      text-align: center;
    }

    .delete-popup-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #FEE2E2 0%, #FECACA 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .delete-popup-icon svg {
      width: 24px;
      height: 24px;
      stroke: var(--color-error);
      stroke-width: 2;
      fill: none;
    }

    .delete-popup-title {
      font-size: 16px;
      color: var(--text-primary);
      font-weight: 600;
      margin-bottom: 16px;
    }

    .delete-popup-content {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .delete-popup-hint {
      font-size: 13px;
      color: var(--color-error);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .delete-popup-hint svg {
      width: 14px;
      height: 14px;
      stroke: var(--color-error);
      stroke-width: 2;
      fill: none;
    }

    .delete-popup-buttons {
      display: flex;
      gap: 12px;
    }

    .delete-btn-cancel {
      flex: 1;
      background: white;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: inherit;
      transition: all 150ms ease-out;
    }

    .delete-btn-cancel:hover {
      background: #F9FAFB;
    }

    .delete-btn-confirm {
      flex: 1;
      background: var(--color-error);
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
      transition: all 150ms ease-out;
    }

    .delete-btn-confirm svg {
      width: 16px;
      height: 16px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    .delete-btn-confirm:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(239, 68, 68, 0.25);
    }

    /* 底部导航 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 -4px 16px rgba(91, 127, 255, 0.08), 0 -2px 8px rgba(91, 127, 255, 0.04);
      border-top: 1px solid rgba(91, 127, 255, 0.08);
      z-index: 10;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      cursor: pointer;
      transition: all 150ms ease-out;
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-icon svg {
      width: 24px;
      height: 24px;
      stroke: var(--text-muted);
      stroke-width: 1.5;
      fill: none;
      transition: stroke 150ms ease-out;
    }

    .nav-label {
      font-size: 12px;
      color: var(--text-muted);
      transition: color 150ms ease-out;
    }

    .nav-item.active .nav-icon svg {
      stroke: var(--color-primary);
    }

    .nav-item.active .nav-label {
      color: var(--color-primary);
      font-weight: 600;
    }

    .nav-item:hover:not(.active) .nav-icon svg {
      stroke: var(--text-secondary);
    }
  </style>
</head>
<body>
  <!-- 顶部导航栏 -->
  <div class="top-nav">
    <div class="nav-back">
      <!-- ChevronLeft icon -->
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div class="nav-title">设置</div>
    <div class="nav-action">
      <!-- 预留位置 -->
    </div>
  </div>

  <div class="page-content">
    <!-- 成员管理 -->
    <div class="settings-section">
      <div class="section-header">
        <!-- Users icon -->
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        成员管理
      </div>
      <div class="section-content">
        <!-- 孩子 -->
        <div class="member-group">
          <div class="member-label">
            <!-- Smile icon -->
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
            孩子
          </div>
          <div class="member-item">
            <div class="member-info">
              <div class="member-avatar child">
                <!-- Smile icon -->
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
              </div>
              <div class="member-name">小明</div>
            </div>
            <button class="member-btn" onclick="showDeleteChildPopup()">
              <!-- Trash2 icon -->
              <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
              删除
            </button>
          </div>
          <div class="member-item">
            <div class="member-info">
              <div class="member-avatar child">
                <!-- Smile icon -->
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
              </div>
              <div class="member-name">小红</div>
            </div>
            <button class="member-btn">
              <!-- Trash2 icon -->
              <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
              删除
            </button>
          </div>
