<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>礼物页 - 家长端</title>
  <link href="https://cdn.jsdelivr.net/npm/smiley-sans@1.1.1/dist/SmileySans-Oblique.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --color-primary: #5B7FFF;
      --color-primary-light: #7B9FFF;
      --color-secondary: #34D399;
      --color-success: #34D399;
      --color-error: #EF4444;
      --color-warning: #FBBF24;
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --text-muted: #9CA3AF;
      --bg-card: #FFFFFF;
      --radius-card: 12px;
      --radius-button: 8px;
      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.08);
      --nav-height: 56px;
    }
    body {
      font-family: 'Smiley Sans Oblique', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #F0F4FF 0%, #E8F0FE 50%, #F5F7FF 100%);
      padding-top: 56px;
      padding-bottom: var(--nav-height);
    }

    /* 顶部导航栏 */
    .top-nav {
      height: 56px;
      background: white;
      border-bottom: 1px solid #E5E7EB;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      box-shadow: 0 2px 8px rgba(91, 127, 255, 0.04);
    }

    .nav-back {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 150ms ease-out;
      border-radius: 8px;
    }

    .nav-back:hover {
      background: #F5F7FF;
    }

    .nav-back svg {
      width: 24px;
      height: 24px;
      stroke: var(--text-primary);
      stroke-width: 2;
      fill: none;
    }

    .nav-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .nav-action {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%235B7FFF' fill-opacity='0.03'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }
    .page-content { padding: 16px; position: relative; z-index: 1; }

    /* 顶部添加按钮 */
    .top-bar { display: flex; justify-content: flex-end; margin-bottom: 16px; }
    .btn-primary {
      background: linear-gradient(135deg, #5B7FFF 0%, #7B9FFF 100%);
      border: none;
      border-radius: var(--radius-button);
      padding: 12px 18px;
      font-size: 14px;
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.15s;
      box-shadow: 0 2px 8px rgba(91, 127, 255, 0.2);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary svg { width: 18px; height: 18px; stroke: white; stroke-width: 2; fill: none; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(91, 127, 255, 0.25); }

    /* 礼物网格 */
    .gift-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 16px; }
    .gift-card {
      background: white;
      border-radius: var(--radius-card);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      border: 1px solid #E5E7EB;
    }
    .gift-bg { padding: 24px 14px; text-align: center; position: relative; overflow: hidden; }
    .gift-bg::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15) 0%, transparent 50%);
    }
    .gift-bg-orange { background: linear-gradient(135deg, #FF6B35 0%, #FF8A50 100%); }
    .gift-bg-teal { background: linear-gradient(135deg, #4ECDC4 0%, #7FDBDA 100%); }
    .gift-bg-yellow { background: linear-gradient(135deg, #FFD93D 0%, #FFE066 100%); }
    .gift-bg-blue { background: linear-gradient(135deg, #60A5FA 0%, #93C5FD 100%); }

    .gift-bg-icon { width: 36px; height: 36px; margin: 0 auto 10px; background: rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .gift-bg-icon svg { width: 20px; height: 20px; stroke: white; stroke-width: 2; fill: none; }

    .gift-name-bg { font-size: 16px; color: white; font-weight: 600; }
    .gift-footer { padding: 14px; text-align: center; }
    .gift-points { font-size: 14px; color: var(--color-primary); font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .gift-points svg { width: 14px; height: 14px; stroke: var(--color-primary); stroke-width: 2; fill: none; }
    .gift-btns { display: flex; gap: 8px; }
    .gift-btn {
      flex: 1;
      background: white;
      border: 1px solid #E5E7EB;
      border-radius: 6px;
      padding: 8px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .gift-btn svg { width: 14px; height: 14px; stroke: var(--text-secondary); stroke-width: 2; fill: none; }
    .gift-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .gift-btn:hover svg { stroke: var(--color-primary); }
    .gift-btn.delete:hover { border-color: var(--color-error); color: var(--color-error); }
    .gift-btn.delete:hover svg { stroke: var(--color-error); }

    /* 兑换记录区域 */
    .redeem-section { background: white; border-radius: var(--radius-card); box-shadow: var(--shadow-card); border: 1px solid #E5E7EB; margin-bottom: 12px; }
    .redeem-header { padding: 14px 18px; border-radius: var(--radius-card) var(--radius-card) 0 0; font-size: 15px; color: var(--text-primary); font-weight: 500; display: flex; align-items: center; gap: 10px; }
    .redeem-header svg { width: 18px; height: 18px; stroke-width: 2; fill: none; }
    .redeem-header.pending { background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%); }
    .redeem-header.pending svg { stroke: var(--color-warning); }
    .redeem-header.confirmed { background: linear-gradient(135deg, #D1FAE5 0%, #A7F3D0 100%); }
    .redeem-header.confirmed svg { stroke: var(--color-success); }
    .redeem-list { padding: 18px; }
    .redeem-item { display: flex; align-items: flex-start; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #E5E7EB; }
    .redeem-item:last-child { border-bottom: none; }
    .redeem-info { flex: 1; }
    .redeem-name { font-size: 14px; color: var(--text-primary); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .redeem-name svg { width: 16px; height: 16px; stroke: var(--color-primary); stroke-width: 2; fill: none; }
    .redeem-meta { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
    .redeem-meta svg { width: 12px; height: 12px; stroke: var(--text-muted); stroke-width: 2; fill: none; }
    .redeem-points { font-size: 14px; color: var(--color-error); font-weight: 600; margin-right: 14px; display: flex; align-items: center; gap: 4px; }
    .redeem-points svg { width: 14px; height: 14px; stroke: var(--color-error); stroke-width: 2; fill: none; }
    .redeem-btns { display: flex; gap: 8px; }
    .redeem-btn { background: white; border: 1px solid #E5E7EB; border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-family: inherit; transition: all 0.15s; display: flex; align-items: center; gap: 4px; }
    .redeem-btn svg { width: 14px; height: 14px; stroke-width: 2; fill: none; }
    .redeem-btn.confirm { color: var(--color-success); }
    .redeem-btn.confirm svg { stroke: var(--color-success); }
    .redeem-btn.confirm:hover { background: var(--color-success); color: white; border-color: var(--color-success); }
    .redeem-btn.confirm:hover svg { stroke: white; }
    .redeem-btn.undo svg { stroke: var(--text-secondary); }
    .redeem-btn.undo:hover { border-color: var(--color-error); color: var(--color-error); }
    .redeem-btn.undo:hover svg { stroke: var(--color-error); }

    /* 弹窗样式 */
    .popup-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); z-index: 200; display: none; backdrop-filter: blur(2px); }
    .popup-overlay.show { display: block; }
    .popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border-radius: 16px; width: 90%; max-width: 340px; box-shadow: 0 16px 48px rgba(0,0,0,0.2); z-index: 201; display: none; }
    .popup.show { display: block; animation: popIn 0.2s ease-out; }
    @keyframes popIn { 0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    .popup-header { padding: 18px; border-bottom: 1px solid #E5E7EB; display: flex; align-items: center; gap: 10px; }
    .popup-header svg { width: 20px; height: 20px; stroke: var(--color-primary); stroke-width: 2; fill: none; }
    .popup-title { font-size: 16px; color: var(--text-primary); font-weight: 600; }
    .popup-body { padding: 18px; }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 14px; color: var(--text-primary); margin-bottom: 10px; font-weight: 500; }
    .form-input { width: 100%; height: 44px; border: 1px solid #E5E7EB; border-radius: var(--radius-button); padding: 12px 16px; font-size: 15px; font-family: inherit; background: #F9FAFB; transition: all 0.15s; }
    .form-input:focus { outline: none; border-color: var(--color-primary); background: white; }
    .popup-footer { padding: 18px; display: flex; gap: 12px; }
    .popup-btn-cancel { flex: 1; background: white; border: 1px solid #E5E7EB; border-radius: 8px; padding: 12px; font-size: 15px; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
    .popup-btn-confirm { flex: 1; background: linear-gradient(135deg, #5B7FFF 0%, #7B9FFF 100%); border: none; border-radius: 8px; padding: 12px; font-size: 15px; color: white; cursor: pointer; font-family: inherit; font-weight: 500; box-shadow: 0 2px 8px rgba(91,127,255,0.2); }
    .popup-btn-confirm:hover { box-shadow: 0 4px 12px rgba(91,127,255,0.25); }

    /* 确认兑换弹窗 */
    .confirm-popup { padding: 28px; text-align: center; }
    .confirm-popup-icon { width: 48px; height: 48px; margin: 0 auto 16px; background: linear-gradient(135deg, #D1FAE5 0%, #A7F3D0 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .confirm-popup-icon svg { width: 24px; height: 24px; stroke: var(--color-success); stroke-width: 2; fill: none; }
    .confirm-popup-title { font-size: 16px; color: var(--text-primary); font-weight: 600; margin-bottom: 20px; }
    .confirm-popup-item { display: flex; justify-content: space-between; padding: 10px 0; font-size: 14px; }
    .confirm-popup-label { color: var(--text-secondary); }
    .confirm-popup-value { color: var(--text-primary); font-weight: 500; display: flex; align-items: center; gap: 4px; }
    .confirm-popup-value svg { width: 14px; height: 14px; stroke: var(--text-primary); stroke-width: 2; fill: none; }
    .confirm-popup-hint { font-size: 13px; color: var(--color-warning); margin-top: 8px; margin-bottom: 24px; }
    .confirm-popup-buttons { display: flex; gap: 12px; }
    .confirm-btn-cancel { flex: 1; background: white; border: 1px solid #E5E7EB; border-radius: 8px; padding: 12px; font-size: 15px; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
    .confirm-btn-ok { flex: 1; background: var(--color-success); border: none; border-radius: 8px; padding: 12px; font-size: 15px; color: white; cursor: pointer; font-family: inherit; font-weight: 500; }

    /* 底部导航 */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-height); background: white; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 -4px 16px rgba(0,0,0,0.08); border-top: 1px solid #E5E7EB; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 12px; cursor: pointer; position: relative; }
    .nav-item::before { content: ''; position: absolute; top: -4px; left: 50%; transform: translateX(-50%); width: 20px; height: 3px; background: var(--color-primary); border-radius: 3px; opacity: 0; }
    .nav-item.active::before { opacity: 1; }
    .nav-icon svg { width: 24px; height: 24px; stroke: var(--text-muted); stroke-width: 1.5; fill: none; }
    .nav-item.active .nav-icon svg { stroke: var(--color-primary); }
    .nav-label { font-size: 12px; color: var(--text-muted); }
    .nav-item.active .nav-label { color: var(--color-primary); font-weight: 600; }
  </style>
</head>
<body>
  <!-- 顶部导航栏 -->
  <div class="top-nav">
    <div class="nav-back">
      <!-- ChevronLeft icon -->
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div class="nav-title">礼物管理</div>
    <div class="nav-action">
      <!-- Plus icon - 添加礼物 -->
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="var(--color-primary)" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </div>
  </div>

  <div class="page-content">
    <!-- 添加按钮已移至顶部导航栏右侧 -->
    <div class="gift-grid">
      <div class="gift-card">
        <div class="gift-bg gift-bg-orange">
          <div class="gift-bg-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
          <div class="gift-name-bg">玩具车</div>
        </div>
        <div class="gift-footer">
          <div class="gift-points"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>50 积分</div>
          <div class="gift-btns">
            <button class="gift-btn" onclick="showEditPopup()"><svg viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>编辑</button>
            <button class="gift-btn delete" onclick="showDeletePopup()"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>删除</button>
          </div>
        </div>
      </div>
      <div class="gift-card">
        <div class="gift-bg gift-bg-teal">
          <div class="gift-bg-icon"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3 3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3 3h7z"/></svg></div>
          <div class="gift-name-bg">绘本</div>
        </div>
        <div class="gift-footer">
          <div class="gift-points"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>30 积分</div>
          <div class="gift-btns">
            <button class="gift-btn"><svg viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>编辑</button>
            <button class="gift-btn delete"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>删除</button>
          </div>
        </div>
      </div>
      <div class="gift-card">
        <div class="gift-bg gift-bg-yellow">
          <div class="gift-bg-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></div>
          <div class="gift-name-bg">冰淇淋</div>
        </div>
        <div class="gift-footer">
          <div class="gift-points"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>20 积分</div>
          <div class="gift-btns">
            <button class="gift-btn"><svg viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>编辑</button>
            <button class="gift-btn delete"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>删除</button>
          </div>
        </div>
      </div>
      <div class="gift-card">
        <div class="gift-bg gift-bg-blue">
          <div class="gift-bg-icon"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg></div>
          <div class="gift-name-bg">电影票</div>
        </div>
        <div class="gift-footer">
          <div class="gift-points"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>100 积分</div>
          <div class="gift-btns">
            <button class="gift-btn"><svg viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>编辑</button>
            <button class="gift-btn delete"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>删除</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 待确认兑换 -->
    <div class="redeem-section">
      <div class="redeem-header pending">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        待确认兑换（2 条）
      </div>
      <div class="redeem-list">
        <div class="redeem-item">
          <div class="redeem-info">
            <div class="redeem-name"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3 3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3 3h7z"/></svg>小明兑换了「绘本」</div>
            <div class="redeem-meta"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>5月21日 10:30</div>
          </div>
          <div class="redeem-points"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>-30积分</div>
          <div class="redeem-btns">
            <button class="redeem-btn confirm" onclick="showConfirmPopup()"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>确认</button>
            <button class="redeem-btn undo"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>撤销</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 已确认兑换 -->
    <div class="redeem-section">
